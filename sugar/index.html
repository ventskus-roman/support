<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sugar Detector AI · Support</title><style>body{margin:0;background:#f7f5ef;color:#192522;font:17px/1.65 -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}main{max-width:800px;margin:auto;padding:32px 24px}h1{font-size:34px;line-height:1.2}select{font:inherit;padding:8px;border-radius:10px}a{color:#0b7162}#contact{display:inline-block;padding:12px 18px;background:#0b7162;color:white;border-radius:12px}pre{white-space:pre-wrap;font:inherit}footer{border-top:1px solid #ccd7ce;padding-top:20px}</style><main><select id="locale" aria-label="Language"></select><article dir="auto"><h1 id="name">Sugar Detector AI — Support</h1><a id="contact" href="mailto:scofield665@gmail.com">Contact support</a><p><a href="mailto:scofield665@gmail.com">scofield665@gmail.com</a></p><pre id="guide"></pre></article><footer><a href="https://ventskus-roman.github.io/policy/privacy_sugar">Privacy policy (English)</a> · <a href="https://www.apple.com/legal/internet-services/itunes/dev/stdeula/">Apple EULA</a></footer></main><script type="application/json" id="data">{"ar-SA": {"name": "السكر المضاف AI", "contact": "تواصل مع الدعم", "guide": "اكتشف السكر المضاف قبل أن تأكل. صوّر قائمة المكونات أو وجبة، أو امسح الرمز الشريطي للمنتج. يساعدك التطبيق على فهم محتويات طعامك واتخاذ خيارات تناسب أهدافك.\n\nتحقّق من المكونات\nاعرف ما إذا تم العثور على سكر مضاف، والمكونات التي تحتوي عليه، وأي مُحلّيات موجودة. اطّلع على كميات السكر المتاحة بالغرامات وملاعق الشاي ومكعبات السكر. النتيجة الخالية من السكر المضاف لا تعني أن الطعام لا يحتوي على سكريات موجودة طبيعيًا.\n\nابنِ عادة يومية\nحدّد الحد اليومي الذي يناسبك، وسجّل الأطعمة التي تتناولها، وتابع تقدمك الأسبوعي وحافظ على سلسلة أيام متواصلة. شاهد مجموعك اليومي في أداة الشاشة الرئيسية، واحفظ بيانات السكر المسجّلة في Apple Health إذا رغبت.\n\nاسأل عن طعامك\nاطرح أسئلة إضافية عن الحصص أو المكونات أو البدائل الأقل سكرًا. اختر هدفًا لتكييف التحليل والاقتراحات معه.\n\nابدأ مجانًا\nمسح الرموز الشريطية مجاني. وتحصل أيضًا على عملية مسح واحدة للصورة مجانًا كل يوم. يزيل بريميوم الحد اليومي الذي يفرضه التطبيق على مسح الصور، ويتيح طرح أسئلة عن عمليات المسح السابقة. تتوفر اشتراكات أسبوعية وسنوية؛ يظهر السعر ومدى أهليتك للفترة التجريبية قبل الشراء.\n\nقد تكون نتائج الذكاء الاصطناعي تقديرية، خاصةً للوجبات والملصقات غير المقروءة. لا يقدم التطبيق نصائح طبية. تحقّق من العبوة واستشر طبيبك بشأن احتياجاتك الغذائية.\n\nتُرسل الصور والأسئلة بأمان إلى OpenAI بعد موافقتك، ولا تُستخدم لتدريب نماذجها."}, "bn": {"name": "চিনি AI - খাবার যাচাই", "contact": "সহায়তার জন্য যোগাযোগ করুন", "guide": "খাওয়ার আগে জেনে নিন, খাবারে আলাদা করে চিনি যোগ করা হয়েছে কি না। উপাদানের তালিকা বা খাবারের ছবি তুলুন, অথবা পণ্যের বারকোড স্ক্যান করুন। চিনি AI খাবারে কী আছে তা বুঝতে এবং নিজের লক্ষ্যের সঙ্গে মানানসই সিদ্ধান্ত নিতে সাহায্য করে।\n\nউপাদান যাচাই করুন\nযোগ করা চিনি পাওয়া গেছে কি না, কোন উপাদানে তা আছে এবং কোনো মিষ্টিকারক আছে কি না দেখুন। তথ্য থাকলে চিনির পরিমাণ গ্রাম, চা-চামচ ও চিনির কিউব হিসেবে দেখুন। যোগ করা চিনি না পাওয়া মানেই খাবারে প্রাকৃতিকভাবে থাকা শর্করা নেই, এমন নয়।\n\nদৈনিক অভ্যাস গড়ুন\nনিজের দৈনিক সীমা ঠিক করুন, খাওয়া খাবার নথিভুক্ত করুন, সাপ্তাহিক অগ্রগতি দেখুন এবং টানা নথিভুক্ত করার ধারা বজায় রাখুন। উইজেটে দৈনিক মোট দেখুন এবং চাইলে নথিভুক্ত চিনির পরিমাণ Apple Health-এ সংরক্ষণ করুন।\n\nখাবার নিয়ে প্রশ্ন করুন\nখাবারের পরিমাণ, উপাদান বা কম চিনির বিকল্প নিয়ে আরও প্রশ্ন করুন। বিশ্লেষণ ও পরামর্শ নিজের মতো করে পেতে একটি লক্ষ্য বেছে নিন।\n\nবিনামূল্যে শুরু করুন\nবারকোড স্ক্যান বিনামূল্যে। প্রতিদিন একটি ছবি স্ক্যানও বিনামূল্যে পাবেন। প্রিমিয়াম অ্যাপের দৈনিক ছবি-স্ক্যানের সীমা সরিয়ে দেয় এবং আগের স্ক্যান নিয়ে প্রশ্ন করার সুবিধা দেয়। সাপ্তাহিক ও বার্ষিক সাবস্ক্রিপশন রয়েছে; ট্রায়ালের যোগ্যতা ও দাম কেনার আগে দেখানো হয়।\n\nAI-এর ফল আনুমানিক হতে পারে, বিশেষত রান্না করা খাবার বা অস্পষ্ট লেবেলের ক্ষেত্রে। এই অ্যাপ চিকিৎসা-পরামর্শ দেয় না। প্যাকেটের তথ্য মিলিয়ে নিন এবং খাদ্যসংক্রান্ত প্রয়োজন নিয়ে চিকিৎসকের পরামর্শ নিন।\n\nআপনার অনুমতির পরে ছবি ও প্রশ্ন নিরাপদে OpenAI-তে পাঠানো হয় এবং তাদের মডেল প্রশিক্ষণে ব্যবহার করা হয় না।"}, "ca": {"name": "Sucre afegit IA", "contact": "Contacta amb el servei d’assistència", "guide": "Detecta el sucre afegit abans de menjar. Fotografia una llista d’ingredients o un àpat, o escaneja el codi de barres d’un producte. Sucre afegit IA t’ajuda a entendre què contenen els aliments i a triar segons els teus objectius.\n\nREVISA ELS INGREDIENTS\nConsulta si s’ha trobat sucre afegit, quins ingredients en contenen i quins edulcorants hi ha. Mira les quantitats de sucre disponibles en grams, culleradetes i terrossos. Un resultat sense sucre afegit no vol dir que l’aliment no contingui sucres presents de manera natural.\n\nCREA UN HÀBIT DIARI\nFixa el teu propi límit diari, registra el que menges, segueix el progrés setmanal i mantén una ratxa de dies. Consulta el total del dia al giny i, si vols, desa el sucre registrat a Apple Salut.\n\nPREGUNTA SOBRE EL QUE MENGES\nFes preguntes de seguiment sobre racions, ingredients o alternatives amb menys sucre. Tria un objectiu per adaptar l’anàlisi i els suggeriments.\n\nCOMENÇA GRATIS\nEls escaneigs de codis de barres són gratuïts. També tens un escaneig de foto gratuït al dia. Premium elimina el límit diari d’escaneigs de fotos de l’app i permet fer preguntes sobre escaneigs anteriors. Hi ha subscripcions setmanals i anuals; el preu i els requisits per accedir a una possible prova es mostren abans de comprar.\n\nEls resultats de la IA poden ser estimacions, sobretot per a àpats i etiquetes il·legibles. Aquesta app no ofereix assessorament mèdic. Comprova l’envàs i consulta el metge sobre les teves necessitats alimentàries.\n\nLes fotos i preguntes s’envien de manera segura a OpenAI després del teu consentiment i no s’utilitzen per entrenar els seus models."}, "cs": {"name": "Přidaný cukr AI", "contact": "Kontaktovat podporu", "guide": "Odhalte přidaný cukr ještě před jídlem. Vyfoťte seznam složek nebo jídlo, případně naskenujte čárový kód výrobku. Aplikace vám pomůže porozumět složení potravin a vybírat podle vlastních cílů.\n\nZKONTROLUJTE SLOŽENÍ\nZjistěte, zda byl nalezen přidaný cukr, které složky ho obsahují a jaká sladidla jsou přítomna. Prohlédněte si dostupné množství cukru v gramech, lžičkách a kostkách. Výsledek bez přidaného cukru neznamená, že potravina neobsahuje přirozeně se vyskytující cukry.\n\nBUDUJTE KAŽDODENNÍ NÁVYK\nNastavte si vlastní denní limit, zapisujte snědené potraviny, sledujte týdenní pokrok a udržujte sérii dní. Denní součet uvidíte ve widgetu a zaznamenaný cukr můžete volitelně ukládat do Apple Health.\n\nPTEJTE SE NA JÍDLO\nPokládejte doplňující otázky o porcích, složení nebo alternativách s menším množstvím cukru. Vyberte cíl a přizpůsobte mu analýzu a návrhy.\n\nZAČNĚTE ZDARMA\nSkenování čárových kódů je zdarma. Každý den získáte také jedno bezplatné skenování fotografie. Premium ruší denní limit skenování fotografií v aplikaci a zpřístupňuje otázky ke starším skenům. K dispozici je týdenní a roční předplatné; cena i případný nárok na zkušební období se zobrazí před nákupem.\n\nVýsledky AI mohou být odhady, zejména u jídel a nečitelných etiket. Aplikace neposkytuje lékařské rady. Ověřte údaje na obalu a své výživové potřeby konzultujte s lékařem.\n\nFotografie a otázky se po vašem souhlasu bezpečně odesílají do OpenAI a nepoužívají se k trénování modelů."}, "da": {"name": "Tilsat sukker AI - Madtjek", "contact": "Kontakt support", "guide": "Find tilsat sukker, før du spiser. Tag et billede af en ingrediensliste eller et måltid, eller scan et produkts stregkode. Tilsat sukker AI hjælper dig med at forstå, hvad din mad indeholder, og træffe valg, der passer til dine mål.\n\nTJEK INGREDIENSERNE\nSe, om der blev fundet tilsat sukker, hvilke ingredienser der indeholder det, og hvilke sødestoffer der er i produktet. Se tilgængelige sukkermængder i gram, teskefulde og sukkerknalder. Et resultat uden tilsat sukker betyder ikke, at maden er fri for naturligt forekommende sukkerarter.\n\nSKAB EN DAGLIG VANE\nSæt din egen daglige grænse, registrer det, du spiser, følg dine ugentlige fremskridt, og hold en serie af dage i gang. Se dagens samlede indtag i widgetten, og gem registreret sukker i Apple Sundhed, hvis du ønsker det.\n\nSPØRG OM DIN MAD\nStil opfølgende spørgsmål om portioner, ingredienser eller alternativer med mindre sukker. Vælg et mål for at tilpasse analysen og forslagene.\n\nSTART GRATIS\nStregkodescanninger er gratis. Du får også én gratis fotoscanning om dagen. Premium fjerner appens daglige grænse for fotoscanninger og giver adgang til spørgsmål om tidligere scanninger. Der er ugentlige og årlige abonnementer; pris og eventuel berettigelse til en prøveperiode vises inden køb.\n\nAI-resultater kan være skøn, især for måltider og ulæselige etiketter. Denne app giver ikke lægelig rådgivning. Tjek emballagen, og tal med din læge om dine kostbehov.\n\nBilleder og spørgsmål sendes sikkert til OpenAI efter dit samtykke og bruges ikke til at træne virksomhedens modeller."}, "de-DE": {"name": "Zucker KI - Lebensmittelcheck", "contact": "Support kontaktieren", "guide": "Entdecke zugesetzten Zucker, bevor du isst. Fotografiere eine Zutatenliste oder eine Mahlzeit oder scanne den Barcode eines Produkts. Zucker KI hilft dir, dein Essen besser zu verstehen und Entscheidungen zu treffen, die zu deinen Zielen passen.\n\nZUTATEN PRÜFEN\nSieh, ob zugesetzter Zucker erkannt wurde, in welchen Zutaten er steckt und welche Süßungsmittel enthalten sind. Verfügbare Zuckermengen werden in Gramm, Teelöffeln und Zuckerwürfeln angezeigt. Kein zugesetzter Zucker bedeutet nicht, dass ein Lebensmittel keinen natürlich vorkommenden Zucker enthält.\n\nDEINE TÄGLICHE ROUTINE\nLege dein eigenes Tageslimit fest, protokolliere dein Essen, verfolge deine Fortschritte im Wochenverlauf und sammle Tage in Folge. Im Widget siehst du deine Tagessumme. Auf Wunsch speicherst du protokollierten Zucker in Apple Health.\n\nFRAGEN ZU DEINEM ESSEN\nStelle weitere Fragen zu Portionen, Zutaten oder Alternativen mit weniger Zucker. Wähle ein Ziel, um Analyse und Vorschläge darauf abzustimmen.\n\nKOSTENLOS STARTEN\nBarcode-Scans sind kostenlos. Außerdem erhältst du täglich einen kostenlosen Foto-Scan. Premium hebt das tägliche Limit der App für Foto-Scans auf und schaltet Fragen zu früheren Scans frei. Es gibt Wochen- und Jahresabos. Preis und mögliche Berechtigung für einen Testzeitraum siehst du vor dem Kauf.\n\nKI-Ergebnisse können Schätzungen sein, besonders bei Mahlzeiten und unleserlichen Etiketten. Diese App bietet keine medizinische Beratung. Prüfe die Verpackung und besprich deine Ernährungsbedürfnisse mit deinem Arzt.\n\nFotos und Fragen werden erst nach deiner Zustimmung sicher an OpenAI gesendet und nicht zum Trainieren seiner Modelle verwendet."}, "el": {"name": "Πρόσθετη ζάχαρη AI", "contact": "Επικοινωνία με την υποστήριξη", "guide": "Εντόπισε την πρόσθετη ζάχαρη πριν φας. Φωτογράφισε τη λίστα συστατικών ή ένα γεύμα, ή σάρωσε τον γραμμωτό κώδικα ενός προϊόντος. Η εφαρμογή σε βοηθά να κατανοείς τι περιέχει το φαγητό σου και να επιλέγεις σύμφωνα με τους στόχους σου.\n\nΕΛΕΓΞΕ ΤΑ ΣΥΣΤΑΤΙΚΑ\nΔες αν εντοπίστηκε πρόσθετη ζάχαρη, ποια συστατικά την περιέχουν και αν υπάρχουν γλυκαντικά. Δες τις διαθέσιμες ποσότητες ζάχαρης σε γραμμάρια, κουταλάκια και κύβους. Ένα αποτέλεσμα χωρίς πρόσθετη ζάχαρη δεν σημαίνει ότι το τρόφιμο δεν περιέχει φυσικά σάκχαρα.\n\nΧΤΙΣΕ ΜΙΑ ΚΑΘΗΜΕΡΙΝΗ ΣΥΝΗΘΕΙΑ\nΌρισε το δικό σου ημερήσιο όριο, κατέγραφε όσα τρως, παρακολούθησε την εβδομαδιαία πρόοδο και κράτησε το σερί σου. Δες το ημερήσιο σύνολο στο widget και, προαιρετικά, αποθήκευσε την καταγεγραμμένη ζάχαρη στο Apple Health.\n\nΡΩΤΗΣΕ ΓΙΑ ΤΟ ΦΑΓΗΤΟ ΣΟΥ\nΚάνε συμπληρωματικές ερωτήσεις για μερίδες, συστατικά ή εναλλακτικές με λιγότερη ζάχαρη. Επίλεξε έναν στόχο για να προσαρμόσεις την ανάλυση και τις προτάσεις.\n\nΞΕΚΙΝΗΣΕ ΔΩΡΕΑΝ\nΟι σαρώσεις γραμμωτών κωδίκων είναι δωρεάν. Έχεις επίσης μία δωρεάν σάρωση φωτογραφίας την ημέρα. Το Premium καταργεί το ημερήσιο όριο σαρώσεων φωτογραφιών της εφαρμογής και ξεκλειδώνει ερωτήσεις για παλαιότερες σαρώσεις. Διατίθενται εβδομαδιαίες και ετήσιες συνδρομές· η τιμή και τυχόν δικαίωμα δοκιμής εμφανίζονται πριν από την αγορά.\n\nΤα αποτελέσματα AI μπορεί να είναι εκτιμήσεις, ειδικά για γεύματα και δυσανάγνωστες ετικέτες. Η εφαρμογή δεν παρέχει ιατρικές συμβουλές. Έλεγξε τη συσκευασία και συμβουλεύσου τον γιατρό σου για τις διατροφικές σου ανάγκες.\n\nΟι φωτογραφίες και οι ερωτήσεις αποστέλλονται με ασφάλεια στην OpenAI μετά τη συγκατάθεσή σου και δεν χρησιμοποιούνται για την εκπαίδευση των μοντέλων της."}, "en-US": {"name": "Added Sugar AI - Food checker", "contact": "Contact support", "guide": "Find added sugar before you eat. Photograph an ingredient list or a meal, or scan a product barcode. Added Sugar AI helps you understand what is in your food and make choices that fit your goals.\n\nCHECK THE INGREDIENTS\nSee whether added sugar was found, which ingredients contain it, and any sweeteners. View available sugar amounts in grams, teaspoons and sugar cubes. A result without added sugar does not mean the food has no naturally occurring sugar.\n\nBUILD YOUR DAILY HABIT\nSet your own daily limit, log the foods you eat, follow your weekly progress and keep a streak. See your daily total in the widget, and optionally save logged sugar to Apple Health.\n\nASK ABOUT YOUR FOOD\nAsk follow-up questions about portions, ingredients or lower-sugar alternatives. Choose a goal to adjust the analysis and suggestions.\n\nSTART FREE\nBarcode scans are free. You also get one free photo scan per day. Premium removes the app's daily photo-scan limit and unlocks questions about older scans. Weekly and yearly subscriptions are available; any trial eligibility and price are shown before purchase.\n\nAI results can be estimates, especially for meals and unreadable labels. This app is not medical advice. Check the packaging and consult your doctor about dietary needs.\n\nPhotos and questions are sent securely to OpenAI after your permission and are not used to train its models."}, "es-ES": {"name": "Azúcar añadido IA", "contact": "Contactar con soporte", "guide": "Encuentra el azúcar añadido antes de comer. Fotografía una lista de ingredientes o una comida, o escanea el código de barras de un producto. Azúcar añadido IA te ayuda a entender qué contienen tus alimentos y a elegir según tus objetivos.\n\nREVISA LOS INGREDIENTES\nConsulta si se ha detectado azúcar añadido, qué ingredientes lo contienen y qué edulcorantes hay. Mira las cantidades de azúcar disponibles en gramos, cucharaditas y terrones. Que no haya azúcar añadido no significa que el alimento no contenga azúcares presentes de forma natural.\n\nCREA TU HÁBITO DIARIO\nFija tu propio límite diario, registra los alimentos que comes, sigue tu progreso semanal y mantén una racha de días. Consulta el total del día en el widget y, si quieres, guarda el azúcar registrado en Apple Salud.\n\nPREGUNTA SOBRE TU COMIDA\nHaz preguntas de seguimiento sobre las porciones, los ingredientes o las alternativas con menos azúcar. Elige un objetivo para adaptar el análisis y las sugerencias.\n\nEMPIEZA GRATIS\nLos escaneos de códigos de barras son gratis. También tienes un escaneo de foto gratis al día. Premium elimina el límite diario de escaneos de fotos de la app y permite hacer preguntas sobre escaneos anteriores. Hay suscripciones semanales y anuales; el precio y los requisitos para acceder a una posible prueba se muestran antes de comprar.\n\nLos resultados de la IA pueden ser estimaciones, especialmente en comidas y etiquetas ilegibles. Esta app no ofrece asesoramiento médico. Comprueba el envase y consulta con tu médico tus necesidades alimentarias.\n\nLas fotos y preguntas se envían de forma segura a OpenAI tras tu autorización y no se usan para entrenar sus modelos."}, "es-MX": {"name": "Azúcar añadida IA", "contact": "Contactar a soporte", "guide": "Encuentra el azúcar añadida antes de comer. Toma una foto de una lista de ingredientes o de una comida, o escanea el código de barras de un producto. Azúcar añadida IA te ayuda a entender qué contienen tus alimentos y a elegir según tus metas.\n\nREVISA LOS INGREDIENTES\nConsulta si se detectó azúcar añadida, qué ingredientes la contienen y qué edulcorantes hay. Revisa las cantidades de azúcar disponibles en gramos, cucharaditas y cubos de azúcar. Que no haya azúcar añadida no significa que el alimento no contenga azúcares presentes de forma natural.\n\nCREA TU HÁBITO DIARIO\nEstablece tu propio límite diario, registra lo que comes, sigue tu progreso semanal y mantén una racha de días. Consulta el total del día en el widget y, si quieres, guarda el azúcar registrado en Apple Salud.\n\nPREGUNTA SOBRE TU COMIDA\nHaz preguntas de seguimiento sobre porciones, ingredientes o alternativas con menos azúcar. Elige una meta para adaptar el análisis y las sugerencias.\n\nEMPIEZA GRATIS\nLos escaneos de códigos de barras son gratis. También tienes un escaneo de foto gratis al día. Premium elimina el límite diario de escaneos de fotos de la app y permite hacer preguntas sobre escaneos anteriores. Hay suscripciones semanales y anuales; el precio y tu elegibilidad para una posible prueba se muestran antes de comprar.\n\nLos resultados de la IA pueden ser estimaciones, especialmente para comidas y etiquetas ilegibles. Esta app no ofrece asesoría médica. Revisa el empaque y consulta a tu médico sobre tus necesidades alimentarias.\n\nLas fotos y preguntas se envían de forma segura a OpenAI después de tu autorización y no se usan para entrenar sus modelos."}, "fi": {"name": "Sokeri AI - Ruokatutka", "contact": "Ota yhteyttä tukeen", "guide": "Tunnista lisätty sokeri ennen syömistä. Kuvaa ainesosaluettelo tai ateria tai skannaa tuotteen viivakoodi. Sokeri AI auttaa ymmärtämään, mitä ruokasi sisältää, ja tekemään tavoitteisiisi sopivia valintoja.\n\nTARKISTA AINESOSAT\nKatso, löytyikö lisättyä sokeria, mitkä ainesosat sisältävät sitä ja mitä makeutusaineita tuotteessa on. Tarkastele saatavilla olevia sokerimääriä grammoina, teelusikallisina ja sokeripaloina. Tulos ilman lisättyä sokeria ei tarkoita, ettei ruoka sisältäisi luontaisesti esiintyviä sokereita.\n\nLUO PÄIVITTÄINEN TAPA\nAseta oma päivittäinen rajasi, kirjaa syömäsi ruoat, seuraa edistymistäsi viikoittain ja pidä päiväputkea yllä. Näe päivän kokonaismäärä widgetissä ja tallenna kirjattu sokeri halutessasi Apple Terveyteen.\n\nKYSY RUOASTASI\nEsitä jatkokysymyksiä annoksista, ainesosista tai vähemmän sokeria sisältävistä vaihtoehdoista. Valitse tavoite, jonka mukaan analyysi ja ehdotukset mukautuvat.\n\nALOITA ILMAISEKSI\nViivakoodien skannaus on ilmaista. Saat myös yhden ilmaisen kuvatarkistuksen päivässä. Premium poistaa sovelluksen päivittäisen kuvatarkistusrajan ja avaa kysymykset aiemmista tarkistuksista. Saatavilla on viikko- ja vuositilauksia. Hinta ja mahdollinen oikeus kokeilujaksoon näytetään ennen ostoa.\n\nTekoälyn tulokset voivat olla arvioita etenkin aterioista ja epäselvistä tuoteselosteista. Sovellus ei anna lääketieteellisiä neuvoja. Tarkista pakkaus ja keskustele ravitsemustarpeistasi lääkärisi kanssa.\n\nKuvat ja kysymykset lähetetään turvallisesti OpenAI:lle suostumuksesi jälkeen, eikä niitä käytetä sen mallien kouluttamiseen."}, "fr-FR": {"name": "Sucre ajouté IA - Aliments", "contact": "Contacter l’assistance", "guide": "Repérez le sucre ajouté avant de manger. Photographiez une liste d’ingrédients ou un repas, ou scannez le code-barres d’un produit. Sucre ajouté IA vous aide à comprendre ce que vous mangez et à faire des choix adaptés à vos objectifs.\n\nVÉRIFIEZ LES INGRÉDIENTS\nDécouvrez si du sucre ajouté a été détecté, quels ingrédients en contiennent et quels édulcorants sont présents. Consultez les quantités de sucre disponibles en grammes, cuillères à café et morceaux de sucre. L’absence de sucre ajouté ne signifie pas que l’aliment ne contient pas de sucres naturellement présents.\n\nCRÉEZ VOTRE HABITUDE QUOTIDIENNE\nFixez votre propre limite quotidienne, notez les aliments consommés, suivez vos progrès chaque semaine et cumulez les jours consécutifs. Consultez votre total du jour dans le widget et, si vous le souhaitez, enregistrez le sucre consigné dans Apple Santé.\n\nPOSEZ VOS QUESTIONS\nPosez des questions complémentaires sur les portions, les ingrédients ou les alternatives moins sucrées. Choisissez un objectif pour adapter l’analyse et les suggestions.\n\nCOMMENCEZ GRATUITEMENT\nLes scans de codes-barres sont gratuits. Vous bénéficiez aussi d’un scan photo gratuit par jour. Premium supprime la limite quotidienne de scans photo de l’app et permet de poser des questions sur les anciens scans. Des abonnements hebdomadaires et annuels sont proposés. Le prix et votre éventuelle éligibilité à un essai sont indiqués avant l’achat.\n\nLes résultats de l’IA peuvent être des estimations, surtout pour les repas et les étiquettes illisibles. Cette app ne fournit pas de conseils médicaux. Vérifiez l’emballage et consultez votre médecin concernant vos besoins alimentaires.\n\nAvec votre autorisation, les photos et les questions sont transmises de manière sécurisée à OpenAI et ne servent pas à entraîner ses modèles."}, "he": {"name": "סוכר מוסף AI", "contact": "יצירת קשר עם התמיכה", "guide": "גלו סוכר מוסף לפני האכילה. צלמו רשימת רכיבים או ארוחה, או סרקו ברקוד של מוצר. האפליקציה עוזרת להבין מה יש במזון שלכם ולבחור בהתאם למטרות שלכם.\n\nבדקו את הרכיבים\nראו אם נמצא סוכר מוסף, אילו רכיבים מכילים אותו ואם יש ממתיקים. הציגו כמויות סוכר זמינות בגרמים, בכפיות ובקוביות סוכר. תוצאה ללא סוכר מוסף אינה אומרת שאין במזון סוכרים טבעיים.\n\nבנו הרגל יומי\nהגדירו גבול יומי משלכם, תעדו את המזונות שאכלתם, עקבו אחר ההתקדמות השבועית ושמרו על רצף ימים. ראו את הכמות היומית בווידג׳ט, ולבחירתכם שמרו את נתוני הסוכר שתיעדתם ב-Apple Health.\n\nשאלו על האוכל שלכם\nשאלו שאלות המשך על מנות, רכיבים או חלופות עם פחות סוכר. בחרו מטרה כדי להתאים את הניתוח וההצעות.\n\nהתחילו בחינם\nסריקות ברקוד הן בחינם. תקבלו גם סריקת תמונה אחת בחינם בכל יום. פרימיום מסיר את המגבלה היומית של האפליקציה על סריקות תמונה ומאפשר לשאול על סריקות קודמות. יש מינויים שבועיים ושנתיים; המחיר והזכאות לתקופת ניסיון מוצגים לפני הרכישה.\n\nתוצאות הבינה המלאכותית עשויות להיות הערכות, במיוחד בארוחות ובתוויות שאינן קריאות. האפליקציה אינה מספקת ייעוץ רפואי. בדקו את האריזה והתייעצו עם הרופא לגבי צורכי התזונה שלכם.\n\nתמונות ושאלות נשלחות באופן מאובטח ל-OpenAI לאחר קבלת רשותכם, ואינן משמשות לאימון המודלים שלה."}, "hi": {"name": "शुगर AI - भोजन जाँच", "contact": "सहायता से संपर्क करें", "guide": "खाने से पहले पता लगाएँ कि उसमें अलग से चीनी मिलाई गई है या नहीं। सामग्री सूची या भोजन की फ़ोटो लें, या उत्पाद का बारकोड स्कैन करें। शुगर AI भोजन में क्या है, यह समझने और अपने लक्ष्य के अनुसार चुनाव करने में मदद करता है।\n\nसामग्री जाँचें\nदेखें कि अतिरिक्त रूप से मिलाई गई चीनी मिली या नहीं, किन सामग्रियों में वह है और कौन से मिठास देने वाले पदार्थ हैं। उपलब्ध चीनी की मात्रा ग्राम, चाय के चम्मच और चीनी के क्यूब में देखें। अतिरिक्त चीनी न मिलने का मतलब यह नहीं कि भोजन में प्राकृतिक रूप से मौजूद शर्करा भी नहीं है।\n\nरोज़ की आदत बनाएँ\nअपनी दैनिक सीमा तय करें, खाया हुआ भोजन दर्ज करें, साप्ताहिक प्रगति देखें और लगातार दर्ज करने का सिलसिला बनाए रखें। विजेट में रोज़ का कुल देखें और चाहें तो दर्ज की गई चीनी की मात्रा Apple Health में सहेजें।\n\nभोजन के बारे में पूछें\nमात्रा, सामग्री या कम चीनी वाले विकल्पों पर आगे सवाल पूछें। विश्लेषण और सुझावों को अपने अनुसार ढालने के लिए लक्ष्य चुनें।\n\nमुफ़्त शुरुआत करें\nबारकोड स्कैन मुफ़्त हैं। हर दिन एक फ़ोटो स्कैन भी मुफ़्त मिलता है। प्रीमियम ऐप की रोज़ की फ़ोटो-स्कैन सीमा हटाता है और पुराने स्कैन पर सवाल पूछने की सुविधा देता है। साप्ताहिक और वार्षिक सदस्यताएँ उपलब्ध हैं; ट्रायल की पात्रता और कीमत खरीदारी से पहले दिखाई जाती है।\n\nAI के नतीजे अनुमान हो सकते हैं, खासकर भोजन और अस्पष्ट लेबल के लिए। यह ऐप चिकित्सा सलाह नहीं देता। पैकेजिंग जाँचें और अपनी आहार संबंधी ज़रूरतों पर डॉक्टर से सलाह लें।\n\nआपकी अनुमति मिलने के बाद फ़ोटो और सवाल सुरक्षित रूप से OpenAI को भेजे जाते हैं और उसके मॉडल को प्रशिक्षित करने में इस्तेमाल नहीं होते।"}, "hr": {"name": "Dodani šećer AI", "contact": "Kontaktirajte podršku", "guide": "Prepoznaj dodani šećer prije jela. Fotografiraj popis sastojaka ili obrok, ili skeniraj crtični kod proizvoda. Aplikacija ti pomaže razumjeti što tvoja hrana sadrži i birati u skladu s vlastitim ciljevima.\n\nPROVJERI SASTOJKE\nPogledaj je li pronađen dodani šećer, koji ga sastojci sadrže i ima li sladila. Provjeri dostupne količine šećera u gramima, čajnim žličicama i kockama. Rezultat bez dodanog šećera ne znači da hrana ne sadrži prirodno prisutne šećere.\n\nSTVORI SVAKODNEVNU NAVIKU\nPostavi vlastitu dnevnu granicu, bilježi što jedeš, prati tjedni napredak i održavaj niz uzastopnih dana. Dnevni zbroj vidi u widgetu, a zabilježeni šećer po želji spremi u Apple Health.\n\nPITAJ O HRANI\nPostavi dodatna pitanja o porcijama, sastojcima ili zamjenama s manje šećera. Odaberi cilj kako bi mu se prilagodili analiza i prijedlozi.\n\nPOČNI BESPLATNO\nSkeniranje crtičnih kodova je besplatno. Svaki dan dobivaš i jedno besplatno skeniranje fotografije. Premium uklanja dnevno ograničenje skeniranja fotografija u aplikaciji i omogućuje pitanja o starijim skeniranjima. Dostupne su tjedne i godišnje pretplate; cijena i pravo na probno razdoblje prikazuju se prije kupnje.\n\nRezultati umjetne inteligencije mogu biti procjene, osobito za obroke i nečitljive etikete. Aplikacija ne daje medicinske savjete. Provjeri ambalažu i razgovaraj s liječnikom o svojim prehrambenim potrebama.\n\nFotografije i pitanja sigurno se šalju OpenAI-ju nakon tvojeg dopuštenja i ne upotrebljavaju se za treniranje modela."}, "hu": {"name": "Hozzáadott cukor MI", "contact": "Kapcsolat az ügyfélszolgálattal", "guide": "Ismerd fel a hozzáadott cukrot, mielőtt ennél. Fotózd le az összetevőlistát vagy az ételt, vagy olvasd be a termék vonalkódját. Az alkalmazás segít megérteni, mit tartalmaz az ételed, és a céljaidhoz illő döntéseket hozni.\n\nELLENŐRIZD AZ ÖSSZETEVŐKET\nNézd meg, talált-e az elemzés hozzáadott cukrot, mely összetevők tartalmazzák, és milyen édesítőszerek vannak benne. Ha rendelkezésre áll adat, láthatod a cukor mennyiségét grammban, teáskanálban és kockacukorban. A hozzáadott cukor nélküli eredmény nem jelenti azt, hogy az étel természetes cukrokat sem tartalmaz.\n\nALAKÍTS KI NAPI SZOKÁST\nÁllíts be saját napi határt, naplózd, amit eszel, kövesd a heti haladást, és tartsd fenn a napi sorozatodat. A napi összesítést a widgeten is láthatod, a naplózott cukrot pedig igény szerint az Apple Healthbe is mentheted.\n\nKÉRDEZZ AZ ÉTELEDRŐL\nTegyél fel további kérdéseket az adagokról, összetevőkről vagy kevesebb cukrot tartalmazó alternatívákról. Válassz célt az elemzés és a javaslatok személyre szabásához.\n\nKEZDD INGYEN\nA vonalkódok beolvasása ingyenes. Naponta egy ingyenes fotóelemzést is kapsz. A Prémium feloldja az alkalmazás napi fotóelemzési korlátját, és kérdezhetsz a korábbi elemzésekről is. Heti és éves előfizetés érhető el; az árat és a próbaidőszakra való jogosultságot vásárlás előtt láthatod.\n\nAz MI eredményei becslések lehetnek, különösen készételek és olvashatatlan címkék esetén. Az alkalmazás nem ad orvosi tanácsot. Ellenőrizd a csomagolást, és étrendi szükségleteidről egyeztess orvosoddal.\n\nA fotók és kérdések az engedélyed után biztonságosan kerülnek az OpenAI-hoz, és nem használják őket a modellek tanítására."}, "id": {"name": "Gula Tambahan AI - Cek Makanan", "contact": "Hubungi dukungan", "guide": "Kenali gula tambahan sebelum makan. Foto daftar komposisi atau makanan, atau pindai barkode produk. Gula Tambahan AI membantu Anda memahami kandungan makanan dan memilih sesuai tujuan Anda.\n\nPERIKSA KOMPOSISI\nLihat apakah gula tambahan ditemukan, bahan mana yang mengandungnya, dan pemanis apa yang ada. Lihat jumlah gula yang tersedia dalam gram, sendok teh, dan kubus gula. Hasil tanpa gula tambahan bukan berarti makanan tidak mengandung gula alami.\n\nBANGUN KEBIASAAN HARIAN\nTentukan batas harian sendiri, catat makanan yang Anda makan, ikuti progres mingguan, dan pertahankan catatan hari berturut-turut. Lihat total harian di widget dan, jika diinginkan, simpan asupan gula yang dicatat ke Apple Health.\n\nTANYAKAN SOAL MAKANAN\nAjukan pertanyaan lanjutan tentang porsi, komposisi, atau alternatif yang lebih rendah gula. Pilih tujuan untuk menyesuaikan analisis dan saran.\n\nMULAI GRATIS\nPemindaian barkode gratis. Anda juga mendapat satu pemindaian foto gratis per hari. Premium menghapus batas harian pemindaian foto di aplikasi dan membuka pertanyaan tentang hasil pindai terdahulu. Tersedia langganan mingguan dan tahunan; kelayakan uji coba dan harga ditampilkan sebelum pembelian.\n\nHasil AI bisa berupa perkiraan, terutama untuk makanan siap santap dan label yang sulit dibaca. Aplikasi ini tidak memberikan nasihat medis. Periksa kemasan dan konsultasikan kebutuhan pola makan dengan dokter.\n\nFoto dan pertanyaan dikirim dengan aman ke OpenAI setelah Anda memberi izin, dan tidak digunakan untuk melatih modelnya."}, "it": {"name": "Zuccheri aggiunti IA", "contact": "Contatta l’assistenza", "guide": "Individua gli zuccheri aggiunti prima di mangiare. Fotografa una lista di ingredienti o un pasto, oppure scansiona il codice a barre di un prodotto. Zuccheri aggiunti IA ti aiuta a capire cosa contiene il tuo cibo e a scegliere in base ai tuoi obiettivi.\n\nCONTROLLA GLI INGREDIENTI\nScopri se sono stati rilevati zuccheri aggiunti, quali ingredienti li contengono e quali dolcificanti sono presenti. Visualizza le quantità di zucchero disponibili in grammi, cucchiaini e zollette. L’assenza di zuccheri aggiunti non significa che l’alimento non contenga zuccheri naturalmente presenti.\n\nCREA UN’ABITUDINE QUOTIDIANA\nImposta il tuo limite giornaliero, registra ciò che mangi, segui i progressi settimanali e mantieni una serie di giorni consecutivi. Consulta il totale del giorno nel widget e, se vuoi, salva lo zucchero registrato in Apple Salute.\n\nFAI DOMANDE SUL CIBO\nFai domande di approfondimento su porzioni, ingredienti o alternative con meno zucchero. Scegli un obiettivo per adattare analisi e suggerimenti.\n\nINIZIA GRATIS\nLe scansioni dei codici a barre sono gratuite. Hai anche una scansione fotografica gratuita al giorno. Premium elimina il limite giornaliero dell’app per le scansioni fotografiche e sblocca le domande sulle scansioni precedenti. Sono disponibili abbonamenti settimanali e annuali; prezzo ed eventuale idoneità alla prova sono indicati prima dell’acquisto.\n\nI risultati dell’IA possono essere stime, soprattutto per i pasti e le etichette illeggibili. Questa app non fornisce consulenza medica. Controlla la confezione e consulta il tuo medico per le tue esigenze alimentari.\n\nFoto e domande vengono inviate in modo sicuro a OpenAI dopo il tuo consenso e non vengono usate per addestrare i suoi modelli."}, "ja": {"name": "添加糖AI - 食品チェック", "contact": "サポートに問い合わせる", "guide": "食べる前に、加えられた糖をチェック。原材料表示や食事を撮影するか、商品のバーコードをスキャンしてください。添加糖AIは、食品に何が含まれているかを理解し、自分の目標に合った選択をするお手伝いをします。\n\n原材料を確認\n添加糖が見つかったか、どの原材料に含まれているか、甘味料が使われているかを確認できます。取得できた糖の量は、グラム、ティースプーン、角砂糖で表示します。添加糖が見つからなくても、食品にもともと含まれる糖がないとは限りません。\n\n毎日の習慣に\n1日の上限を自分で設定し、食べたものを記録。週ごとの推移を確認しながら、連続記録を続けましょう。ウィジェットでその日の合計を確認でき、記録した糖の量をAppleヘルスケアに保存することも選べます。\n\n食べ物について質問\n量や原材料、糖の少ない代替品について、追加で質問できます。目標を選ぶと、分析や提案が目標に合わせて調整されます。\n\n無料でスタート\nバーコードスキャンは無料です。写真スキャンも1日1回無料で使えます。プレミアムではアプリの1日あたりの写真スキャン回数制限がなくなり、過去のスキャンについても質問できます。週間・年間プランをご用意しています。体験利用の対象になるかどうかと料金は、購入前に表示されます。\n\nAIの結果は推定値の場合があり、特に食事や読み取りにくい表示ではその可能性があります。本アプリは医療上の助言を提供するものではありません。パッケージを確認し、食事上の必要事項については医師にご相談ください。\n\n写真と質問は、許可をいただいた後にOpenAIへ安全に送信され、同社のモデルの学習には使用されません。"}, "ko": {"name": "첨가당 AI - 식품 확인", "contact": "고객 지원에 문의", "guide": "먹기 전에 첨가당을 확인하세요. 성분표나 식사를 촬영하거나 제품 바코드를 스캔해 보세요. 첨가당 AI는 음식에 무엇이 들어 있는지 이해하고 자신의 목표에 맞는 선택을 하도록 도와줍니다.\n\n성분 확인\n첨가당이 발견되었는지, 어떤 성분에 들어 있는지, 감미료가 있는지 확인하세요. 확인 가능한 당류 함량을 그램, 티스푼, 각설탕 단위로 볼 수 있습니다. 첨가당이 발견되지 않았다고 해서 식품에 원래 들어 있는 당류까지 없다는 뜻은 아닙니다.\n\n매일 기록하는 습관\n하루 한도를 직접 정하고 먹은 음식을 기록하며 주간 진행 상황과 연속 기록을 확인하세요. 위젯에서 일일 합계를 보고, 원한다면 기록한 당류 섭취량을 Apple 건강에 저장할 수 있습니다.\n\n음식에 대해 질문\n섭취 분량, 성분, 당류가 더 적은 대안에 대해 추가로 질문하세요. 목표를 선택하면 분석과 제안이 그에 맞게 조정됩니다.\n\n무료로 시작\n바코드 스캔은 무료입니다. 사진 스캔도 하루 한 번 무료로 이용할 수 있습니다. 프리미엄은 앱의 일일 사진 스캔 횟수 제한을 없애고 이전 스캔에 대한 질문을 열어 줍니다. 주간 및 연간 구독을 이용할 수 있으며, 체험 이용 자격과 가격은 구매 전에 표시됩니다.\n\nAI 결과는 추정치일 수 있으며, 특히 식사나 읽기 어려운 라벨의 경우 그렇습니다. 이 앱은 의학적 조언을 제공하지 않습니다. 포장 정보를 확인하고 개인 식단에 관한 필요 사항은 의사와 상담하세요.\n\n사진과 질문은 사용자의 허락을 받은 후 OpenAI로 안전하게 전송되며, 해당 회사의 모델 학습에 사용되지 않습니다."}, "mr": {"name": "साखर AI - अन्न तपासणी", "contact": "मदतीसाठी संपर्क साधा", "guide": "खाण्यापूर्वी अन्नात वेगळी साखर घातली आहे का ते जाणून घ्या. घटकांची यादी किंवा जेवणाचा फोटो काढा, किंवा उत्पादनाचा बारकोड स्कॅन करा. साखर AI तुम्हाला अन्नात काय आहे ते समजून घेण्यास आणि आपल्या उद्दिष्टांना अनुरूप निवड करण्यास मदत करते.\n\nघटक तपासा\nअतिरिक्त साखर आढळली का, कोणत्या घटकांमध्ये ती आहे आणि गोडवा देणारे पदार्थ आहेत का ते पाहा. उपलब्ध साखरेचे प्रमाण ग्रॅम, चहाचे चमचे आणि साखरेच्या क्यूबमध्ये पाहा. अतिरिक्त साखर आढळली नाही याचा अर्थ अन्नात नैसर्गिकरीत्या असलेली साखरही नाही असा होत नाही.\n\nरोजची सवय लावा\nआपली दैनंदिन मर्यादा ठरवा, खाल्लेल्या अन्नाची नोंद करा, साप्ताहिक प्रगती पाहा आणि सलग नोंदी ठेवण्याचा क्रम चालू ठेवा. विजेटमध्ये दिवसाची एकूण साखर पाहा आणि हवे असल्यास नोंदवलेले साखरेचे प्रमाण Apple Healthमध्ये जतन करा.\n\nअन्नाबद्दल विचारा\nखाण्याचे प्रमाण, घटक किंवा कमी साखरेच्या पर्यायांबद्दल पुढील प्रश्न विचारा. विश्लेषण आणि सूचना आपल्या गरजेनुसार बदलण्यासाठी उद्दिष्ट निवडा.\n\nमोफत सुरुवात करा\nबारकोड स्कॅन मोफत आहेत. दररोज एक फोटो स्कॅनही मोफत मिळतो. प्रीमियममुळे ॲपमधील दररोजच्या फोटो-स्कॅनची मर्यादा काढली जाते आणि जुन्या स्कॅनबद्दल प्रश्न विचारता येतात. साप्ताहिक आणि वार्षिक सदस्यता उपलब्ध आहेत; चाचणीची पात्रता आणि किंमत खरेदीपूर्वी दाखवली जाते.\n\nAIचे निकाल अंदाज असू शकतात, विशेषतः जेवण किंवा अस्पष्ट लेबलांच्या बाबतीत. हे ॲप वैद्यकीय सल्ला देत नाही. पॅकेजिंग तपासा आणि आपल्या आहारविषयक गरजांबद्दल डॉक्टरांचा सल्ला घ्या.\n\nतुमच्या परवानगीनंतर फोटो आणि प्रश्न सुरक्षितपणे OpenAIला पाठवले जातात आणि त्यांची मॉडेल प्रशिक्षित करण्यासाठी वापरले जात नाहीत."}, "ms": {"name": "Gula Tambahan AI - Semak", "contact": "Hubungi sokongan", "guide": "Kenal pasti gula tambahan sebelum anda makan. Ambil foto senarai ramuan atau hidangan, atau imbas kod bar produk. Gula Tambahan AI membantu anda memahami kandungan makanan dan membuat pilihan yang sesuai dengan matlamat anda.\n\nSEMAK RAMUAN\nLihat sama ada gula tambahan ditemui, ramuan yang mengandunginya dan sebarang pemanis. Lihat jumlah gula yang tersedia dalam gram, sudu teh dan kiub gula. Keputusan tanpa gula tambahan tidak bermakna makanan itu tiada gula semula jadi.\n\nBINA TABIAT HARIAN\nTetapkan had harian sendiri, catat makanan yang dimakan, ikuti kemajuan mingguan dan kekalkan rekod hari berturut-turut. Lihat jumlah harian dalam widget dan, jika mahu, simpan pengambilan gula yang dicatat ke Apple Health.\n\nTANYA TENTANG MAKANAN\nTanya soalan susulan tentang saiz hidangan, ramuan atau pilihan yang lebih rendah gula. Pilih matlamat untuk menyesuaikan analisis dan cadangan.\n\nMULA SECARA PERCUMA\nImbasan kod bar adalah percuma. Anda juga mendapat satu imbasan foto percuma setiap hari. Premium membuang had harian imbasan foto dalam aplikasi dan membolehkan soalan tentang imbasan terdahulu. Langganan mingguan dan tahunan tersedia; kelayakan percubaan serta harga dipaparkan sebelum pembelian.\n\nHasil AI mungkin berupa anggaran, terutama bagi hidangan dan label yang sukar dibaca. Aplikasi ini tidak memberikan nasihat perubatan. Semak bungkusan dan rujuk doktor tentang keperluan pemakanan anda.\n\nFoto dan soalan dihantar dengan selamat kepada OpenAI selepas mendapat izin anda dan tidak digunakan untuk melatih modelnya."}, "nl-NL": {"name": "Suiker AI - Voedingscheck", "contact": "Contact opnemen met support", "guide": "Ontdek toegevoegde suiker voordat je eet. Fotografeer een ingrediëntenlijst of maaltijd, of scan de streepjescode van een product. Suiker AI helpt je begrijpen wat er in je eten zit en keuzes maken die bij je doelen passen.\n\nBEKIJK DE INGREDIËNTEN\nZie of er toegevoegde suiker is gevonden, welke ingrediënten die bevatten en welke zoetstoffen aanwezig zijn. Bekijk beschikbare hoeveelheden suiker in grammen, theelepels en suikerklontjes. Geen toegevoegde suiker betekent niet dat een voedingsmiddel geen van nature aanwezige suikers bevat.\n\nBOUW EEN DAGELIJKSE GEWOONTE OP\nStel je eigen daglimiet in, registreer wat je eet, volg je wekelijkse voortgang en bouw een reeks dagen op. Bekijk je dagtotaal in de widget en sla geregistreerde suiker desgewenst op in Apple Gezondheid.\n\nSTEL VRAGEN OVER JE ETEN\nStel vervolgvragen over porties, ingrediënten of alternatieven met minder suiker. Kies een doel om de analyse en suggesties daarop af te stemmen.\n\nBEGIN GRATIS\nStreepjescodes scannen is gratis. Je krijgt ook één gratis fotoscan per dag. Premium heft de dagelijkse fotoscanlimiet van de app op en ontgrendelt vragen over eerdere scans. Er zijn week- en jaarabonnementen; de prijs en eventuele geschiktheid voor een proefperiode worden vóór aankoop getoond.\n\nAI-resultaten kunnen schattingen zijn, vooral bij maaltijden en onleesbare etiketten. Deze app geeft geen medisch advies. Controleer de verpakking en bespreek je voedingsbehoeften met je arts.\n\nFoto’s en vragen worden na jouw toestemming veilig naar OpenAI verstuurd en worden niet gebruikt om de modellen van OpenAI te trainen."}, "no": {"name": "Tilsatt sukker AI - Matsjekk", "contact": "Kontakt kundestøtte", "guide": "Finn tilsatt sukker før du spiser. Ta bilde av en ingrediensliste eller et måltid, eller skann strekkoden på et produkt. Tilsatt sukker AI hjelper deg å forstå hva maten din inneholder og ta valg som passer målene dine.\n\nSJEKK INGREDIENSENE\nSe om tilsatt sukker ble funnet, hvilke ingredienser som inneholder det, og hvilke søtstoffer som finnes. Se tilgjengelige sukkermengder i gram, teskjeer og sukkerbiter. Et resultat uten tilsatt sukker betyr ikke at maten er fri for naturlig forekommende sukkerarter.\n\nBYGG EN DAGLIG VANE\nSett din egen daglige grense, registrer maten du spiser, følg fremgangen fra uke til uke og hold en rekke av dager i gang. Se dagens totalsum i widgeten, og lagre registrert sukker i Apple Helse hvis du ønsker det.\n\nSPØR OM MATEN DIN\nStill oppfølgingsspørsmål om porsjoner, ingredienser eller alternativer med mindre sukker. Velg et mål for å tilpasse analysen og forslagene.\n\nSTART GRATIS\nStrekkodeskanninger er gratis. Du får også én gratis bildeskanning per dag. Premium fjerner appens daglige grense for bildeskanninger og gir tilgang til spørsmål om tidligere skanninger. Ukentlige og årlige abonnementer er tilgjengelige; pris og eventuell rett til en prøveperiode vises før kjøp.\n\nAI-resultater kan være anslag, særlig for måltider og uleselige etiketter. Denne appen gir ikke medisinske råd. Sjekk emballasjen, og snakk med legen din om kostholdsbehovene dine.\n\nBilder og spørsmål sendes sikkert til OpenAI etter ditt samtykke og brukes ikke til å trene modellene deres."}, "pl": {"name": "Cukier dodany AI", "contact": "Skontaktuj się z pomocą", "guide": "Znajdź cukier dodany, zanim zjesz. Zrób zdjęcie składu lub posiłku albo zeskanuj kod kreskowy produktu. Aplikacja pomaga zrozumieć, co zawiera jedzenie, i wybierać zgodnie z własnymi celami.\n\nSPRAWDŹ SKŁAD\nZobacz, czy wykryto cukier dodany, które składniki go zawierają i czy są substancje słodzące. Sprawdź dostępne ilości cukru w gramach, łyżeczkach i kostkach. Brak cukru dodanego nie oznacza braku cukrów naturalnie występujących w żywności.\n\nBUDUJ CODZIENNY NAWYK\nUstaw własny dzienny limit, zapisuj zjedzone produkty, obserwuj tygodniowe postępy i utrzymuj serię dni. Sprawdzaj dzienną sumę w widżecie, a opcjonalnie zapisuj zarejestrowany cukier w Apple Health.\n\nPYTAJ O JEDZENIE\nZadawaj dodatkowe pytania o porcje, składniki lub zamienniki z mniejszą ilością cukru. Wybierz cel, aby dostosować analizę i sugestie.\n\nZACZNIJ BEZPŁATNIE\nSkanowanie kodów kreskowych jest bezpłatne. Otrzymujesz też jedno bezpłatne skanowanie zdjęcia dziennie. Premium znosi dzienny limit skanowania zdjęć w aplikacji i odblokowuje pytania o wcześniejsze skany. Dostępne są subskrypcje tygodniowe i roczne; cena i uprawnienie do okresu próbnego są wyświetlane przed zakupem.\n\nWyniki AI mogą być szacunkowe, zwłaszcza w przypadku posiłków i nieczytelnych etykiet. Aplikacja nie udziela porad medycznych. Sprawdzaj opakowanie i skonsultuj potrzeby żywieniowe z lekarzem.\n\nZdjęcia i pytania są bezpiecznie przesyłane do OpenAI po uzyskaniu Twojej zgody i nie służą do trenowania modeli."}, "pt-BR": {"name": "Açúcar adicionado IA", "contact": "Falar com o suporte", "guide": "Encontre açúcar adicionado antes de comer. Fotografe uma lista de ingredientes ou uma refeição, ou escaneie o código de barras de um produto. Açúcar adicionado IA ajuda você a entender o que há nos seus alimentos e fazer escolhas de acordo com suas metas.\n\nCONFIRA OS INGREDIENTES\nVeja se foi encontrado açúcar adicionado, quais ingredientes o contêm e quais adoçantes estão presentes. Consulte as quantidades de açúcar disponíveis em gramas, colheres de chá e cubos de açúcar. Um resultado sem açúcar adicionado não significa que o alimento não contenha açúcares naturalmente presentes.\n\nCRIE UM HÁBITO DIÁRIO\nDefina seu próprio limite diário, registre o que come, acompanhe seu progresso semanal e mantenha uma sequência de dias. Veja o total do dia no widget e, se quiser, salve o açúcar registrado no Apple Saúde.\n\nTIRE DÚVIDAS SOBRE SUA COMIDA\nFaça perguntas de acompanhamento sobre porções, ingredientes ou alternativas com menos açúcar. Escolha uma meta para adaptar a análise e as sugestões.\n\nCOMECE GRÁTIS\nAs leituras de códigos de barras são grátis. Você também recebe uma análise de foto grátis por dia. O Premium remove o limite diário de análises de fotos do app e libera perguntas sobre análises anteriores. Há assinaturas semanais e anuais; o preço e sua elegibilidade para um eventual período de teste são exibidos antes da compra.\n\nOs resultados da IA podem ser estimativas, principalmente para refeições e rótulos ilegíveis. Este app não fornece orientação médica. Confira a embalagem e consulte seu médico sobre suas necessidades alimentares.\n\nFotos e perguntas são enviadas com segurança à OpenAI após sua permissão e não são usadas para treinar os modelos dela."}, "pt-PT": {"name": "Açúcar adicionado IA", "contact": "Contactar o apoio", "guide": "Identifique açúcar adicionado antes de comer. Fotografe uma lista de ingredientes ou uma refeição, ou leia o código de barras de um produto. Açúcar adicionado IA ajuda-o a compreender o que contêm os seus alimentos e a fazer escolhas de acordo com os seus objetivos.\n\nVERIFIQUE OS INGREDIENTES\nVeja se foi encontrado açúcar adicionado, quais os ingredientes que o contêm e que edulcorantes estão presentes. Consulte as quantidades de açúcar disponíveis em gramas, colheres de chá e cubos de açúcar. Um resultado sem açúcar adicionado não significa que o alimento não contenha açúcares naturalmente presentes.\n\nCRIE UM HÁBITO DIÁRIO\nDefina o seu próprio limite diário, registe o que come, acompanhe o progresso semanal e mantenha uma sequência de dias. Veja o total do dia no widget e, se quiser, guarde o açúcar registado na Apple Saúde.\n\nFAÇA PERGUNTAS SOBRE A SUA COMIDA\nFaça perguntas de seguimento sobre porções, ingredientes ou alternativas com menos açúcar. Escolha um objetivo para adaptar a análise e as sugestões.\n\nCOMECE GRÁTIS\nAs leituras de códigos de barras são gratuitas. Também dispõe de uma análise de fotografia gratuita por dia. O Premium elimina o limite diário de análises de fotografias da app e permite fazer perguntas sobre análises anteriores. Estão disponíveis subscrições semanais e anuais; o preço e a eventual elegibilidade para um período experimental são apresentados antes da compra.\n\nOs resultados da IA podem ser estimativas, sobretudo para refeições e rótulos ilegíveis. Esta app não fornece aconselhamento médico. Verifique a embalagem e consulte o seu médico sobre as suas necessidades alimentares.\n\nAs fotografias e perguntas são enviadas em segurança para a OpenAI após a sua autorização e não são utilizadas para treinar os modelos da empresa."}, "ro": {"name": "Zahăr adăugat AI", "contact": "Contactează asistența", "guide": "Descoperă zahărul adăugat înainte să mănânci. Fotografiază lista de ingrediente sau o masă ori scanează codul de bare al unui produs. Aplicația te ajută să înțelegi ce conține mâncarea și să alegi în funcție de obiectivele tale.\n\nVERIFICĂ INGREDIENTELE\nVezi dacă a fost identificat zahăr adăugat, ce ingrediente îl conțin și dacă există îndulcitori. Consultă cantitățile de zahăr disponibile în grame, lingurițe și cuburi. Un rezultat fără zahăr adăugat nu înseamnă că alimentul nu conține zaharuri prezente în mod natural.\n\nFORMEAZĂ UN OBICEI ZILNIC\nStabilește propria limită zilnică, notează alimentele consumate, urmărește progresul săptămânal și menține o serie de zile consecutive. Vezi totalul zilnic în widget și, opțional, salvează zahărul înregistrat în Apple Health.\n\nÎNTREABĂ DESPRE MÂNCARE\nPune întrebări suplimentare despre porții, ingrediente sau alternative cu mai puțin zahăr. Alege un obiectiv pentru a adapta analiza și sugestiile.\n\nÎNCEPE GRATUIT\nScanările codurilor de bare sunt gratuite. Primești și o scanare foto gratuită pe zi. Premium elimină limita zilnică de scanări foto din aplicație și deblochează întrebările despre scanările anterioare. Sunt disponibile abonamente săptămânale și anuale; prețul și eligibilitatea pentru o perioadă de probă sunt afișate înainte de cumpărare.\n\nRezultatele AI pot fi estimări, mai ales pentru mese și etichete ilizibile. Aplicația nu oferă sfaturi medicale. Verifică ambalajul și discută cu medicul despre nevoile tale alimentare.\n\nFotografiile și întrebările sunt trimise în siguranță către OpenAI după acordul tău și nu sunt folosite pentru antrenarea modelelor."}, "ru": {"name": "Добавленный сахар: ИИ", "contact": "Связаться с поддержкой", "guide": "Находите добавленный сахар до еды. Сфотографируйте состав или блюдо либо отсканируйте штрихкод продукта. Приложение помогает разобраться в составе еды и выбирать продукты с учётом ваших целей.\n\nПРОВЕРЯЙТЕ СОСТАВ\nУзнайте, обнаружен ли добавленный сахар, в каких ингредиентах он содержится и есть ли подсластители. Смотрите доступные данные о количестве сахара в граммах, чайных ложках и кубиках. Отсутствие добавленного сахара не означает, что в продукте нет природных сахаров.\n\nФОРМИРУЙТЕ ЕЖЕДНЕВНУЮ ПРИВЫЧКУ\nЗадайте свой дневной лимит, записывайте съеденное, следите за прогрессом за неделю и поддерживайте серию дней. Смотрите дневной итог в виджете и при желании сохраняйте данные о записанном сахаре в Apple Health.\n\nЗАДАВАЙТЕ ВОПРОСЫ О ЕДЕ\nУточняйте размер порции, состав или варианты с меньшим содержанием сахара. Выберите цель, чтобы адаптировать анализ и рекомендации.\n\nНАЧНИТЕ БЕСПЛАТНО\nСканирование штрихкодов бесплатно. Также доступно одно бесплатное сканирование по фото в день. Премиум снимает установленный приложением дневной лимит сканирований по фото и открывает вопросы о прошлых сканированиях. Доступны недельная и годовая подписки; цена и право на пробный период отображаются перед покупкой.\n\nРезультаты ИИ могут быть приблизительными, особенно для блюд и нечитаемых этикеток. Приложение не даёт медицинских рекомендаций. Сверяйтесь с упаковкой и обсуждайте особенности питания с врачом.\n\nФото и вопросы безопасно передаются в OpenAI после вашего разрешения и не используются для обучения моделей."}, "sk": {"name": "Pridaný cukor AI", "contact": "Kontaktovať podporu", "guide": "Odhaľte pridaný cukor ešte pred jedlom. Odfoťte zoznam zložiek alebo jedlo, prípadne naskenujte čiarový kód výrobku. Aplikácia vám pomôže pochopiť zloženie potravín a vyberať si podľa vlastných cieľov.\n\nSKONTROLUJTE ZLOŽENIE\nZistite, či sa našiel pridaný cukor, ktoré zložky ho obsahujú a aké sladidlá sú prítomné. Pozrite si dostupné množstvo cukru v gramoch, lyžičkách a kockách. Výsledok bez pridaného cukru neznamená, že potravina neobsahuje prirodzene sa vyskytujúce cukry.\n\nBUDUJTE KAŽDODENNÝ NÁVYK\nNastavte si vlastný denný limit, zapisujte zjedené potraviny, sledujte týždenný pokrok a udržiavajte sériu dní. Denný súčet uvidíte vo widgete a zaznamenaný cukor môžete voliteľne ukladať do Apple Health.\n\nPÝTAJTE SA NA JEDLO\nPoložte doplňujúce otázky o porciách, zložkách alebo alternatívach s menším množstvom cukru. Vyberte si cieľ a prispôsobte mu analýzu a návrhy.\n\nZAČNITE ZADARMO\nSkenovanie čiarových kódov je zadarmo. Každý deň získate aj jedno bezplatné skenovanie fotografie. Premium ruší denný limit skenovania fotografií v aplikácii a sprístupňuje otázky k starším skenom. K dispozícii je týždenné a ročné predplatné; cena aj prípadný nárok na skúšobné obdobie sa zobrazia pred nákupom.\n\nVýsledky AI môžu byť odhady, najmä pri jedlách a nečitateľných etiketách. Aplikácia neposkytuje lekárske rady. Overte údaje na obale a svoje výživové potreby konzultujte s lekárom.\n\nFotografie a otázky sa po vašom súhlase bezpečne odosielajú do OpenAI a nepoužívajú sa na trénovanie modelov."}, "sl": {"name": "Dodani sladkor AI", "contact": "Obrnite se na podporo", "guide": "Odkrij dodani sladkor, preden ješ. Fotografiraj seznam sestavin ali obrok oziroma skeniraj črtno kodo izdelka. Aplikacija ti pomaga razumeti, kaj vsebuje hrana, in izbirati v skladu s tvojimi cilji.\n\nPREVERI SESTAVINE\nPoglej, ali je bil najden dodani sladkor, katere sestavine ga vsebujejo in ali so prisotna sladila. Oglej si razpoložljive količine sladkorja v gramih, čajnih žličkah in kockah. Rezultat brez dodanega sladkorja ne pomeni, da hrana ne vsebuje naravno prisotnih sladkorjev.\n\nUSTVARI VSAKODNEVNO NAVADO\nDoloči svojo dnevno mejo, beleži zaužita živila, spremljaj tedenski napredek in ohranjaj niz zaporednih dni. Dnevni seštevek si oglej v gradniku, zabeleženi sladkor pa po želji shrani v Apple Health.\n\nVPRAŠAJ O HRANI\nPostavi dodatna vprašanja o porcijah, sestavinah ali zamenjavah z manj sladkorja. Izberi cilj, da se mu prilagodijo analiza in predlogi.\n\nZAČNI BREZPLAČNO\nSkeniranje črtnih kod je brezplačno. Vsak dan dobiš tudi eno brezplačno skeniranje fotografije. Premium odstrani dnevno omejitev skeniranja fotografij v aplikaciji in omogoči vprašanja o starejših skeniranjih. Na voljo sta tedenska in letna naročnina; cena in upravičenost do preizkusnega obdobja sta prikazani pred nakupom.\n\nRezultati umetne inteligence so lahko ocene, zlasti pri obrokih in nečitljivih etiketah. Aplikacija ne daje zdravstvenih nasvetov. Preveri embalažo in se o svojih prehranskih potrebah posvetuj z zdravnikom.\n\nFotografije in vprašanja se po tvojem dovoljenju varno pošljejo podjetju OpenAI in se ne uporabljajo za učenje njegovih modelov."}, "sv": {"name": "Tillsatt socker AI - Matkoll", "contact": "Kontakta supporten", "guide": "Upptäck tillsatt socker innan du äter. Fotografera en ingrediensförteckning eller en måltid, eller skanna en produkts streckkod. Tillsatt socker AI hjälper dig att förstå vad din mat innehåller och göra val som passar dina mål.\n\nKOLLA INGREDIENSERNA\nSe om tillsatt socker hittades, vilka ingredienser som innehåller det och vilka sötningsmedel som finns. Visa tillgängliga sockermängder i gram, teskedar och sockerbitar. Ett resultat utan tillsatt socker betyder inte att maten saknar naturligt förekommande sockerarter.\n\nBYGG EN DAGLIG VANA\nSätt din egen dagliga gräns, logga maten du äter, följ dina framsteg vecka för vecka och håll en svit vid liv. Se dagens totalsumma i widgeten och spara registrerat socker i Apple Hälsa om du vill.\n\nSTÄLL FRÅGOR OM MATEN\nStäll följdfrågor om portioner, ingredienser eller alternativ med mindre socker. Välj ett mål för att anpassa analysen och förslagen.\n\nBÖRJA GRATIS\nStreckkodsskanningar är gratis. Du får också en gratis fotoskann K ALIŞKANLIK EDİNİN\nKendi günlük sınırınızı belirleyin, yediklerinizi kaydedin, haftalık ilerlemenizi izleyin ve gün serinizi sürdürün. Günlük toplamı araç takımında görün; isterseniz kaydettiğiniz şeker miktarını Apple Health'e aktarın.\n\nYİYECEKLERİNİZ HAKKINDA SORUN\nPorsiyonlar, bileşenler veya daha az şekerli alternatifler hakkında ek sorular sorun. Analiz ve önerileri uyarlamak için bir hedef seçin.\n\nÜCRETSİZ BAŞLAYIN\nBarkod taramaları ücretsizdir. Her gün bir ücretsiz fotoğraf taraması da sunulur. Premium, uygulamanın günlük fotoğraf tarama sınırını kaldırır ve geçmiş taramalar hakkında soru sormanızı sağlar. Haftalık ve yıllık abonelikler mevcuttur; fiyat ve deneme uygunluğu satın almadan önce gösterilir.\n\nYapay zekâ sonuçları, özellikle öğünlerde ve okunamayan etiketlerde tahmini olabilir. Bu uygulama tıbbi tavsiye vermez. Ambalajı kontrol edin ve beslenme ihtiyaçlarınız için doktorunuza danışın.\n\nFotoğraflar ve sorular izniniz alındıktan sonra OpenAI'a güvenli biçimde gönderilir ve modellerin eğitiminde kullanılmaz."}, "uk": {"name": "Доданий цукор: ШІ", "contact": "Зв’язатися зі службою підтримки", "guide": "Знаходьте доданий цукор до їди. Сфотографуйте склад продукту чи страву або відскануйте штрихкод. Застосунок допомагає зрозуміти, що містить ваша їжа, і робити вибір відповідно до ваших цілей.\n\nПЕРЕВІРЯЙТЕ СКЛАД\nДізнайтеся, чи виявлено доданий цукор, у яких інгредієнтах він міститься та чи є підсолоджувачі. Переглядайте доступні дані про кількість цукру в грамах, чайних ложках і кубиках. Відсутність доданого цукру не означає, що продукт не містить природних цукрів.\n\nФОРМУЙТЕ ЩОДЕННУ ЗВИЧКУ\nУстановіть власний денний ліміт, записуйте з’їдене, стежте за тижневим прогресом і підтримуйте серію днів. Переглядайте денний підсумок у віджеті та за бажанням зберігайте дані про записаний цукор в Apple Health.\n\nЗАПИТУЙТЕ ПРО ЇЖУ\nСтавте уточнювальні запитання про порції, інгредієнти чи альтернативи з меншим вмістом цукру. Оберіть ціль, щоб налаштувати аналіз і пропозиції.\n\nПОЧНІТЬ БЕЗКОШТОВНО\nСканування штрихкодів безкоштовне. Ви також отримуєте одне безкоштовне сканування за фото на день. Преміум скасовує встановлений застосунком денний ліміт сканувань за фото та відкриває запитання про попередні сканування. Доступні тижнева й річна передплати; ціну та право на пробний період показано перед покупкою.\n\nРезультати ШІ можуть бути приблизними, особливо для страв і нерозбірливих етикеток. Застосунок не надає медичних порад. Перевіряйте інформацію на упаковці та обговорюйте потреби в харчуванні з лікарем.\n\nФотографії та запитання безпечно надсилаються до OpenAI після вашого дозволу й не використовуються для навчання моделей."}, "ur": {"name": "شوگر AI - کھانے کی جانچ", "contact": "سپورٹ سے رابطہ کریں", "guide": "کھانے سے پہلے جانیں کہ اس میں اضافی چینی ڈالی گئی ہے یا نہیں۔ اجزا کی فہرست یا کھانے کی تصویر لیں، یا پروڈکٹ کا بارکوڈ اسکین کریں۔ شوگر AI کھانے کے اجزا سمجھنے اور اپنے مقاصد کے مطابق انتخاب کرنے میں مدد دیتا ہے۔\n\nاجزا کی جانچ کریں\nدیکھیں کہ اضافی طور پر ڈالی گئی چینی ملی یا نہیں، کن اجزا میں موجود ہے اور مٹھاس دینے والے کون سے مادے ہیں۔ معلومات دستیاب ہوں تو چینی کی مقدار گرام، چائے کے چمچ اور چینی کے کیوب میں دیکھیں۔ اضافی چینی نہ ملنے کا مطلب یہ نہیں کہ کھانے میں قدرتی طور پر موجود شکر بھی نہیں ہے۔\n\nروزانہ کی عادت بنائیں\nاپنی روزانہ کی حد مقرر کریں، کھایا ہوا کھانا درج کریں، ہفتہ وار پیش رفت دیکھیں اور مسلسل اندراج کا سلسلہ برقرار رکھیں۔ وجٹ میں روزانہ کا کل دیکھیں اور چاہیں تو درج کردہ چینی کی مقدار Apple Health میں محفوظ کریں۔\n\nکھانے کے بارے میں پوچھیں\nکھانے کی مقدار، اجزا یا کم چینی والے متبادل پر مزید سوال پوچھیں۔ تجزیے اور تجاویز کو اپنے مطابق ڈھالنے کے لیے مقصد منتخب کریں۔\n\nمفت آغاز کریں\nبارکوڈ اسکین مفت ہیں۔ روزانہ ایک تصویر کا اسکین بھی مفت ملتا ہے۔ پریمیم ایپ میں روزانہ تصویری اسکین کی حد ہٹا دیتا ہے اور پرانے اسکین کے بارے میں سوال کرنے کی سہولت دیتا ہے۔ ہفتہ وار اور سالانہ سبسکرپشن دستیاب ہیں؛ آزمائشی مدت کی اہلیت اور قیمت خریدنے سے پہلے دکھائی جاتی ہے۔\n\nAI کے نتائج تخمینے ہو سکتے ہیں، خاص طور پر تیار کھانوں اور غیر واضح لیبل کے لیے۔ یہ ایپ طبی مشورہ نہیں دیتی۔ پیکنگ کی معلومات چیک کریں اور اپنی غذائی ضروریات کے بارے میں ڈاکٹر سے مشورہ کریں۔\n\nآپ کی اجازت کے بعد تصاویر اور سوالات محفوظ طریقے سے OpenAI کو بھیجے جاتے ہیں اور اس کے ماڈلز کی تربیت میں استعمال نہیں ہوتے۔"}, "vi": {"name": "Đường AI - Kiểm tra thực phẩm", "contact": "Liên hệ hỗ trợ", "guide": "Tìm đường thêm vào trước khi ăn. Chụp danh sách thành phần hoặc bữa ăn, hay quét mã vạch sản phẩm. Đường AI giúp bạn hiểu trong thực phẩm có gì và lựa chọn phù hợp với mục tiêu của mình.\n\nKIỂM TRA THÀNH PHẦN\nXem có phát hiện đường thêm vào không, thành phần nào chứa loại đường này và có chất tạo ngọt nào. Xem lượng đường có dữ liệu theo gam, thìa cà phê và viên đường. Kết quả không có đường thêm vào không có nghĩa là thực phẩm không chứa đường tự nhiên.\n\nTẠO THÓI QUEN HẰNG NGÀY\nTự đặt giới hạn mỗi ngày, ghi lại thực phẩm đã ăn, theo dõi tiến độ hằng tuần và duy trì chuỗi ngày ghi. Xem tổng lượng trong ngày trên tiện ích và tùy chọn lưu lượng đường đã ghi vào Apple Health.\n\nHỎI VỀ THỰC PHẨM\nĐặt câu hỏi tiếp về khẩu phần, thành phần hoặc lựa chọn ít đường hơn. Chọn mục tiêu để điều chỉnh phân tích và gợi ý.\n\nBẮT ĐẦU MIỄN PHÍ\nQuét mã vạch miễn phí. Bạn còn được một lượt quét ảnh miễn phí mỗi ngày. Gói Cao cấp bỏ giới hạn quét ảnh hằng ngày của ứng dụng và mở tính năng hỏi về kết quả quét cũ. Có gói thuê bao hằng tuần và hằng năm; điều kiện dùng thử và giá được hiển thị trước khi mua.\n\nKết quả AI có thể là ước tính, đặc biệt với bữa ăn và nhãn khó đọc. Ứng dụng không cung cấp lời khuyên y tế. Hãy kiểm tra bao bì và hỏi bác sĩ về nhu cầu ăn uống của bạn.\n\nẢnh và câu hỏi được gửi an toàn đến OpenAI sau khi bạn cho phép, và không được dùng để huấn luyện các mô hình của họ."}, "zh-Hans": {"name": "添加糖 AI - 食品检查", "contact": "联系支持", "guide": "吃之前，先了解有没有添加糖。拍摄配料表或一餐食物，或扫描商品条形码。添加糖 AI 帮助你了解食物中有什么，做出符合个人目标的选择。\n\n查看配料\n了解是否发现添加糖、哪些配料含有添加糖，以及使用了哪些甜味剂。查看可获取的糖含量，以克、茶匙和方糖表示。未发现添加糖，并不代表食物不含天然存在的糖。\n\n养成每日记录习惯\n自行设定每日限量，记录吃过的食物，查看每周进度，保持连续记录。在小组件中查看当日总量，也可选择将已记录的糖摄入量存入 Apple 健康。\n\n询问食物相关问题\n继续询问份量、配料或含糖更少的替代选择。选择个人目标，让分析与建议更贴合你的需求。\n\n免费开始\n条形码扫描免费，每天还可免费拍照扫描一次。高级版移除应用内每日拍照扫描次数限制，并解锁对以往扫描结果的提问。提供周订阅和年订阅；是否符合试用资格以及价格，均会在购买前显示。\n\nAI 结果可能是估算值，尤其是分析餐食或难以辨认的标签时。本应用不提供医疗建议。请核对包装，并就个人饮食需求咨询医生。\n\n经你许可后，照片和问题会安全地发送至 OpenAI，且不会用于训练其模型。"}, "zh-Hant": {"name": "添加糖 AI - 食品檢查", "contact": "聯絡支援", "guide": "吃之前，先了解有沒有添加糖。拍下成分表或一餐食物，或掃描商品條碼。添加糖 AI 幫助你了解食物裡有什麼，做出符合個人目標的選擇。\n\n查看成分\n了解是否發現添加糖、哪些成分含有添加糖，以及使用了哪些甜味劑。查看可取得的糖含量，以公克、茶匙和方糖表示。未發現添加糖，並不代表食物不含天然存在的糖。\n\n養成每日記錄習慣\n自行設定每日上限，記錄吃過的食物，查看每週進度，保持連續紀錄。在小工具中查看當日總量，也可選擇將已記錄的糖攝取量存入 Apple 健康。\n\n詢問食物相關問題\n接著詢問份量、成分或含糖更少的替代選擇。選擇個人目標，讓分析與建議更貼近你的需求。\n\n免費開始\n條碼掃描免費，每天還可免費拍照掃描一次。進階版移除 App 內每日拍照掃描次數限制，並解鎖對過往掃描結果的提問。提供週訂閱和年訂閱；是否符合試用資格及價格，都會在購買前顯示。\n\nAI 結果可能是估算值，尤其是分析餐點或難以辨識的標籤時。本 App 不提供醫療建議。請核對包裝，並就個人飲食需求諮詢醫師。\n\n經你同意後，照片和問題會安全地傳送至 OpenAI，且不會用於訓練其模型。"}}</script><script>const data=JSON.parse(document.querySelector('#data').textContent),s=document.querySelector('#locale');for(const c of Object.keys(data)){const o=document.createElement('option');o.value=c;try{o.textContent=new Intl.DisplayNames([c],{type:'language'}).of(c)}catch{o.textContent=c}s.appendChild(o)}const aliases={'bn-BD':'bn','mr-IN':'mr','sl-SI':'sl','ta-IN':'ta','te-IN':'te','ur-PK':'ur','nb':'no','en':'en-US','de':'de-DE','fr':'fr-FR','nl':'nl-NL','ar':'ar-SA','es':'es-ES'};const requested=decodeURIComponent(location.hash.slice(1));const preferred=[requested,...(navigator.languages||['en-US'])];s.value=preferred.flatMap(x=>[x,aliases[x],x.split('-')[0],aliases[x.split('-')[0]]]).find(x=>data[x])||'en-US';function show(){const v=data[s.value];document.documentElement.lang=s.value;document.documentElement.dir=/^(ar|he|ur)(-|$)/.test(s.value)?'rtl':'ltr';document.querySelector('#name').textContent=v.name;document.querySelector('#contact').textContent=v.contact;document.querySelector('#guide').textContent=v.guide}show();s.addEventListener('change',()=>{show();history.replaceState(null,'','#'+s.value)});</script></html>
